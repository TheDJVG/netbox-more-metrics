---
name: CI
"on":
  push:
    branches:
      - development
      - main
      - master
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # =========================================================================
  # Job 1: Packaging & Environment Quality Gates (Fast Python Matrix)
  # =========================================================================
  packaging-and-quality:
    name: Packaging & Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install "poetry>=2.0.0"
      - name: Validate PEP 621 configuration & lockfile sync
        run: |
          poetry check
      - name: Verify build artifacts (sdist and wheel)
        run: |
          poetry build
  # =========================================================================
  # Job 2: NetBox 4.x Version Matrix Tests (Docker Compose Runner)
  # =========================================================================
  test:
    name: NetBox ${{ matrix.netbox-version }} Tests
    needs: packaging-and-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        netbox-version: ["v4.0", "v4.1", "v4.2", "v4.3", "v4.4", "v4.5", "v4.6", "v4.7"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Start Database & Cache Services
        run: |
          docker compose up -d postgres redis redis-cache
      - name: Build NetBox container for NetBox ${{ matrix.netbox-version }}
        env:
          NETBOX_VER: ${{ matrix.netbox-version }}
        run: |
          docker compose build --build-arg "NETBOX_VER=${NETBOX_VER}" netbox
      - name: Verify Django Schema Migrations
        env:
          NETBOX_VER: ${{ matrix.netbox-version }}
        run: |
          docker compose run --rm -e DEBUG=False netbox ./manage.py makemigrations --check
      - name: Execute Automated Test Suite
        env:
          NETBOX_VER: ${{ matrix.netbox-version }}
        run: |
          docker compose run --rm -e DEBUG=False netbox ./manage.py test netbox_more_metrics --keepdb
      - name: Tear Down Docker Environment
        if: always()
        run: |
          docker compose down -v
  # =========================================================================
  # Job 3: Upstream NetBox Latest Canary (Scheduled / Manual Dispatch)
  # =========================================================================
  canary-latest:
    name: NetBox latest Canary Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: packaging-and-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Start Database & Cache Services
        run: |
          docker compose up -d postgres redis redis-cache
      - name: Build NetBox container for NetBox latest
        env:
          NETBOX_VER: latest
        run: |
          docker compose build --pull --build-arg "NETBOX_VER=${NETBOX_VER}" netbox
      - name: Verify Django Schema Migrations
        env:
          NETBOX_VER: latest
        run: |
          docker compose run --rm -e DEBUG=False netbox ./manage.py makemigrations --check
      - name: Execute Automated Test Suite
        env:
          NETBOX_VER: latest
        run: |
          docker compose run --rm -e DEBUG=False netbox ./manage.py test netbox_more_metrics --keepdb
      - name: Tear Down Docker Environment
        if: always()
        run: |
          docker compose down -v
