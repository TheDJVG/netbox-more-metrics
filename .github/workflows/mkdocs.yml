---
name: Documentation
"on":
  push:
    branches:
      - development
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/mkdocs.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    name: Validate Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Poetry and locked docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "poetry>=2.0.0"
          poetry config virtualenvs.in-project true
          poetry install --only docs --no-root --no-interaction --no-ansi
      - name: Build documentation strictly
        run: |
          poetry run mkdocs build --strict
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Poetry and locked docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "poetry>=2.0.0"
          poetry config virtualenvs.in-project true
          poetry install --only docs --no-root --no-interaction --no-ansi
      - name: Deploy to gh-pages branch
        run: |
          poetry run mkdocs gh-deploy --force
