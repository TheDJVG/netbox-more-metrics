[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "netbox-more-metrics"
version = "0.4.1"
description = "Provide customized metrics on data stored in NetBox."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Daan van Gorkum", email = "me+netbox@dj.vg" },
]
dependencies = [
    "prometheus-client>=0.20.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/TheDJVG/netbox-more-metrics"
Repository = "https://github.com/TheDJVG/netbox-more-metrics"
Documentation = "https://thedjvg.github.io/netbox-more-metrics"

[dependency-groups]
dev = [
    "pre-commit>=3.0.3",
    "black>=23.1.0",
    "ruff>=0.8.0",
    "flake8>=7.0.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-django>=4.5.2",
]

[tool.poetry]
packages = [{include = "netbox_more_metrics"}]

[tool.pytest.ini_options]
testpaths = ["netbox_more_metrics/tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py310"
